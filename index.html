<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spot the Phish · Salem State</title>
  <meta name="description" content="Only one email is real. A phishing awareness game for the Salem State community.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🎣</span>
      <span class="brand-text">Spot the Phish <span class="brand-sub">Salem State</span></span>
    </div>
    <div class="progress" id="progress" aria-live="polite"></div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    Practice game. The emails and links are fake, nothing leaves this page, and nothing you do here is recorded.
  </footer>

  <div id="status-bar" class="status-bar" hidden></div>
  <button id="toast" class="toast" type="button" hidden></button>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="emails.js"></script>
  <script src="game.js"></script>
</body>
</html>
